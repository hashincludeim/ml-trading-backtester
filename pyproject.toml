[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockml"
version = "0.1.0"
description = "Next-day stock direction prediction, backtesting, and an interactive Django dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "yfinance>=0.2.40",
    "pyarrow>=15",
    "plotly>=5.20",
    "joblib>=1.3",
    "statsmodels>=0.14",
    "Django>=5.0",
    # Serves static files when DEBUG=False without a separate web server.
    "whitenoise>=6.6",
]

[project.optional-dependencies]
# Production WSGI server for the Docker image (runserver is for development only).
deploy = ["gunicorn>=22"]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "django-stubs>=5.0",
    "ipykernel",
]
# Renders the explainer video (video/make_video.py): Playwright drives the installed Chrome to
# capture frames, and imageio-ffmpeg bundles an ffmpeg binary to encode them. Not needed to run
# the app.
video = ["playwright>=1.45", "imageio-ffmpeg>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy", "notebooks", "web/dashboard/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD002", "PD003", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["stockml", "dashboard", "config"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = []

[[tool.mypy.overrides]]
module = ["sklearn.*", "yfinance.*", "plotly.*", "joblib.*", "statsmodels.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "web"]
DJANGO_SETTINGS_MODULE = "config.settings.test"
filterwarnings = ["ignore::DeprecationWarning:yfinance.*"]
