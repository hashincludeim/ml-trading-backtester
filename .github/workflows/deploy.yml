# Checks every push and pull request. On main (and each weekday evening after the US close) it
# also downloads prices to today, retrains every model, bakes the data into the Docker image,
# pushes it to GitHub Container Registry, and deploys that image to Google Cloud Run.
# If Yahoo Finance or training fails, nothing is deployed and the site keeps yesterday's data.
# One-time Google Cloud setup: deploy/gcp-setup.sh (see the README).
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy src
      - run: pytest

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # lets the job sign in to Google Cloud without a stored key
    env:
      DJANGO_SECRET_KEY: ci-build-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Download prices and train models
        working-directory: web
        run: |
          python manage.py migrate --noinput
          python manage.py fetch_prices
          python manage.py train_models --all --jobs 4
      - name: Build and push the image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:latest" -t "$image:${GITHUB_SHA::7}" .
          docker push --all-tags "$image"
          echo "IMAGE=$image:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v3
        if: vars.GCP_PROJECT_ID != ''
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: vars.GCP_PROJECT_ID != ''
      - name: Deploy to Cloud Run
        if: vars.GCP_PROJECT_ID != ''
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        # Scales to zero when idle (free tier), at most 2 instances so costs stay capped. One
        # gunicorn process with 4 threads keeps a single in-memory chart cache per instance.
        run: |
          gcloud run deploy stockml \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE" --port 8000 \
            --cpu 1 --memory 1Gi --cpu-boost \
            --min-instances 0 --max-instances 2 --concurrency 4 \
            --set-env-vars WEB_WORKERS=1,WEB_THREADS=4 \
            --service-account "stockml-runtime@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated --quiet
          echo "Live at: $(gcloud run services describe stockml --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" --format='value(status.url)')" >> "$GITHUB_STEP_SUMMARY"
