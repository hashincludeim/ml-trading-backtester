# Checks every push and pull request. On main (and each weekday evening after the US close) it
# also downloads prices to today, retrains every model, bakes the data into the Docker image,
# pushes it to GitHub Container Registry, and tells Azure App Service to pull it.
# If Yahoo Finance or training fails, nothing is pushed and the site keeps yesterday's data.
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy src
      - run: pytest

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DJANGO_SECRET_KEY: ci-build-only
      AZURE_WEBHOOK_URL: ${{ secrets.AZURE_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Download prices and train models
        working-directory: web
        run: |
          python manage.py migrate --noinput
          python manage.py fetch_prices
          python manage.py train_models --all --jobs 4
      - name: Build and push the image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:latest" -t "$image:${GITHUB_SHA::7}" .
          docker push --all-tags "$image"
      - name: Tell Azure to pull the new image
        if: env.AZURE_WEBHOOK_URL != ''
        run: curl -fsS -X POST "$AZURE_WEBHOOK_URL" -o /dev/null
